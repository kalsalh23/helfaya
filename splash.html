<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دليل حلفايا الطبي — جارٍ التحميل</title>
<meta name="theme-color" content="#0277BD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--primary:#0277BD;--secondary:#00A896}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Cairo","Tajawal","Almarai",system-ui,sans-serif;
    background:linear-gradient(145deg,var(--primary) 0%,#01579B 55%,var(--secondary) 100%);
    color:#fff;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .logo-wrap{width:108px;height:108px;display:flex;align-items:center;justify-content:center;margin-top:12vh;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:26px;box-shadow:0 18px 40px rgba(1,87,155,.25)}
  .logo-wrap svg{width:68px;height:68px}
  .text-wrap{line-height:1.5;padding:0 8px}
  h1{font-size:clamp(24px,6vw,30px);font-weight:800;letter-spacing:.2px;margin-bottom:6px}
  .subtitle{font-size:clamp(16px,4.2vw,18px);font-weight:500;color:rgba(255,255,255,.95)}
  .footer{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dev-label{font-size:12px;color:rgba(255,255,255,.72)}
  .dev-name{font-size:16px;font-weight:700}
  .dev-phone{font-size:15px;font-weight:700;color:#fff;letter-spacing:.4px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}
</style>
</head>
<body>
  <div class="logo-wrap" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="6" width="52" height="52" rx="16" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.3)"/>
      <path d="M32 15v34M15 32h34" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="7" fill="#00A896" stroke="#fff" stroke-width="3"/>
    </svg>
  </div>
  <div class="text-wrap">
    <h1>دليل حلفايا الطبي</h1>
    <p class="subtitle">صحتك أقرب إليك</p>
  </div>
  <div class="footer">
    <div class="spinner" role="status" aria-label="جارٍ التحميل"></div>
    <div class="dev-label">تطوير المنصة</div>
    <div class="dev-name">قصي مهند الصالح</div>
    <a class="dev-phone" href="tel:0952639157" dir="ltr">0952639157</a>
  </div>
</body>
</html>
